name: Verify Typer

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build Sites package
        run: npm run build
      - name: Verify Sites contract
        run: npm run test:sites
      - name: Verify writing, mechanics and correspondence
        run: npm test
      - name: Verify GitHub Pages build
        run: npm run build:pages
